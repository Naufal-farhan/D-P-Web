<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Monoton&family=Nabla&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOBSHEET</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ==========================================
       START OVERLAY
       Menutupi seluruh layar saat halaman pertama kali
       dibuka. Klik di sini menghitung sebagai interaksi
       pertama pengguna, sehingga browser mengizinkan audio
       diputar untuk seluruh sisa sesi (lihat setupAudioUnlock
       di js/main.js). Overlay ini hilang setelah diklik.
  =========================================== -->
  <div class="start-overlay" id="startOverlay">
    <button class="start-overlay__btn" id="startOverlayBtn" type="button">
      KLIK UNTUK MULAI
    </button>
  </div>

  <!-- ==========================================
       MAIN WRAPPER
       Membungkus seluruh halaman (tidak scroll)
  =========================================== -->
  <div class="page">

    <!-- ==========================================
         LEFT PANEL
         Berisi daftar tombol jobsheet (01-16)
         Hanya area ini yang boleh discroll
    =========================================== -->
    <section class="jobsheet-panel" id="jobsheetPanel">
      <div class="jobsheet-list" id="jobsheetList">
        <!-- Tombol jobsheet dirender secara dinamis oleh js/main.js
             dari array `jobsheets`. Tidak perlu diedit manual di sini. -->
      </div>
    </section>

    <!-- ==========================================
         RIGHT AREA
         Identitas (kanan atas) + judul dinamis (kanan bawah)
    =========================================== -->
    <section class="right-area">

      <!-- Identitas - fixed, tidak ikut scroll -->
      <div class="identity">
        <h1 class="identity-title">JOBSHEET</h1>
        <p class="identity-name">Naufal Farhan Nur<br />Ramadhan</p>
        <p class="identity-class">TI-2D</p>
      </div>

      <!-- Judul dinamis saat hover tombol (Phase 4) -->
      <div class="active-title" id="activeTitle">
        <!-- Contoh: 01-PENGENALAN HTML -->
      </div>

    </section>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
