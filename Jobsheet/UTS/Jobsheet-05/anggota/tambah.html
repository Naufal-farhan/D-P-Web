<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan | Rental Mobil Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <h2>Rental Mobil Admin</h2>
            <p>Sistem Manajemen Rental</p>
        </div>
        <ul class="nav-links">
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="../buku/list.html">Data Mobil</a></li>
                <li class="active"><a href="../anggota/list.html">Data Pelanggan</a></li>
            </ul>
    </aside>
    <button class="sidebar-overlay" id="sidebar-overlay" type="button" aria-label="Tutup navigasi"></button>

    <div class="main-wrapper">
        <header class="topbar">
            <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="sidebar">☰</button>
            <div class="title">Sistem Manajemen Rental Mobil</div>
            <div class="user-info">Selamat Datang, <strong>Admin Staff</strong></div>
        </header>
        <main class="content-body">
            <h1 class="page-title">Tambah Pelanggan</h1>
            <p class="page-description">Lengkapi data pelanggan. Pada tahap ini form masih berupa contoh antarmuka statis.</p>
            <section class="card">
                <div class="card-header"><h2>Informasi Pelanggan</h2></div>
                <form action="#" method="get">
                    <div class="form-grid">
                    <div class="form-group"><label for="id-pelanggan">ID Pelanggan</label><input id="id-pelanggan" name="id-pelanggan" type="text" placeholder="Contoh: PLG-006" required></div>
                    <div class="form-group"><label for="nama">Nama Lengkap</label><input id="nama" name="nama" type="text" placeholder="Nama pelanggan" required></div>
                    <div class="form-group"><label for="telepon">Nomor Telepon</label><input id="telepon" name="telepon" type="tel" placeholder="08xxxxxxxxxx" required></div>
                    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="nama@example.com" required></div>
                    <div class="form-group"><label for="kota">Kota</label><input id="kota" name="kota" type="text" placeholder="Contoh: Malang" required></div>
                    </div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary">Simpan Data</button><a href="../anggota/list.html" class="btn btn-secondary">Kembali</a></div>
                </form>
            </section>
        </main>
    </div>
    <script src="../assets/js/app.js" defer></script>
</body>
</html>
