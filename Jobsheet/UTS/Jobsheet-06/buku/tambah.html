<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mobil - Rental Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>Rental Mobil Admin</h2>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Dashboard</a></li>
            <li class="active"><a href="list.html">Data Mobil</a></li>
            <li><a href="../anggota/list.html">Data Pelanggan</a></li>
        </ul>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
  <!-- Tombol Toggle Sidebar untuk HP -->
  <button class="menu-toggle" id="menu-toggle">☰</button>
  
  <div class="title">Sistem Manajemen Rental Mobil</div>
  <div class="user-info">Selamat Datang, <strong>Admin Staff</strong></div>
</header>

        <main class="content-body">
            <div class="card form-container">
                <h1 class="page-title">Tambah Data Mobil</h1>

                <form id="form-tambah-buku">
                    <div class="form-group">
                        <label for="id_mobil">ID / Kode Mobil</label>
                        <input type="text" id="id_mobil" name="id_mobil" placeholder="Contoh: MBL-004" required>
                    </div>

                    <div class="form-group">
                        <label for="merk">Merk / Type Mobil</label>
                        <input type="text" id="merk" name="merk" placeholder="Contoh: Honda Brio" required>
                    </div>

                    <div class="form-group">
                        <label for="plat">Plat Nomor</label>
                        <input type="text" id="plat" name="plat" placeholder="Contoh: N 8888 XY" required>
                    </div>

                    <div class="form-group">
                        <label for="tarif">Tarif Per Hari (Rp)</label>
                        <input type="number" id="tarif" name="tarif" placeholder="300000" required>
                    </div>

                    <div class="form-group">
                        <label for="status">Status Ketersediaan</label>
                        <select id="status" name="status">
                            <option value="Tersedia">Tersedia</option>
                            <option value="Disewa">Disewa</option>
                            <option value="Perbaikan">Dalam Perbaikan</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Simpan Mobil</button>
                        <a href="list.html" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../assets/js/buku.js"></script>
</body>

</html>
