<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan - Rental Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>Rental Mobil Admin</h2>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="../buku/list.html">Data Mobil</a></li>
            <li class="active"><a href="list.html">Data Pelanggan</a></li>
        </ul>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <!-- Tombol Toggle Sidebar untuk HP -->
            <button class="menu-toggle" id="menu-toggle">☰</button>

            <div class="title">Sistem Manajemen Rental Mobil</div>
            <div class="user-info">Selamat Datang, <strong>Admin Staff</strong></div>
        </header>

        <main class="content-body">
            <div class="card form-container">
                <h1 class="page-title">Tambah Pelanggan Baru</h1>

                <form id="form-tambah-anggota">
                    <div class="form-group">
                        <label for="id_pelanggan">ID Pelanggan</label>
                        <input type="text" id="id_pelanggan" name="id_pelanggan" placeholder="Contoh: PLG-003" required>
                    </div>

                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama pelanggan" required>
                    </div>

                    <div class="form-group">
                        <label for="nik">No. KTP / SIM</label>
                        <input type="text" id="nik" name="nik" placeholder="Masukkan 16 digit NIK" required>
                    </div>

                    <div class="form-group">
                        <label for="telepon">No. Telepon / WhatsApp</label>
                        <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 081234567890" required>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap</label>
                        <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat domisili"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Simpan Pelanggan</button>
                        <a href="list.html" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../assets/js/anggota.js"></script>
</body>

</html>
