<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mobil | Rental Mobil Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox" aria-label="Tampilkan navigasi">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <h2>Rental Mobil Admin</h2>
            <p>Sistem Manajemen Rental</p>
        </div>
        <ul class="nav-links">
                <li><a href="../index.html">Dashboard</a></li>
                <li class="active"><a href="../buku/list.html">Data Mobil</a></li>
                <li><a href="../anggota/list.html">Data Pelanggan</a></li>
            </ul>
    </aside>
    <label class="sidebar-overlay" for="sidebar-toggle" aria-label="Tutup navigasi"></label>

    <div class="main-wrapper">
        <header class="topbar">
            <label for="sidebar-toggle" class="menu-toggle" aria-label="Buka menu navigasi">☰</label>
            <div class="title">Sistem Manajemen Rental Mobil</div>
            <div class="user-info">Selamat Datang, <strong>Admin Staff</strong></div>
        </header>
        <main class="content-body">
            <h1 class="page-title">Tambah Mobil</h1>
            <p class="page-description">Lengkapi data kendaraan. Pada tahap ini form masih berupa contoh antarmuka statis.</p>
            <section class="card">
                <div class="card-header"><h2>Informasi Mobil</h2></div>
                <form action="#" method="get">
                    <div class="form-grid">
                    <div class="form-group"><label for="id-mobil">ID Mobil</label><input id="id-mobil" name="id-mobil" type="text" placeholder="Contoh: MBL-006" required></div>
                    <div class="form-group"><label for="merk">Merk / Model</label><input id="merk" name="merk" type="text" placeholder="Contoh: Toyota Avanza" required></div>
                    <div class="form-group"><label for="plat">Nomor Polisi</label><input id="plat" name="plat" type="text" placeholder="Contoh: N 1234 AB" required></div>
                    <div class="form-group"><label for="tarif">Tarif per Hari (Rp)</label><input id="tarif" name="tarif" type="number" min="0" placeholder="400000" required></div>
                    <div class="form-group"><label for="status">Status Mobil</label><select id="status" name="status" required><option value="">Pilih status</option><option>Tersedia</option><option>Disewa</option><option>Maintenance</option></select></div>
                    </div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary">Simpan Data</button><a href="list.html" class="btn btn-secondary">Kembali</a></div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
